# Lazygit Configuration with Catppuccin Mocha Theme - v0.55.1 Compatible
# Optimized for delta integration

gui:
  # Enhanced UI settings
  scrollHeight: 2
  scrollPastBottom: true
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: false
  mainPanelSplitMode: 'flexible'
  language: 'auto'

  # Catppuccin Mocha Color Scheme
  theme:
    activeBorderColor:
      - '#cba6f7'  # mauve
      - bold
    inactiveBorderColor:
      - '#6c7086'  # overlay1
    optionsTextColor:
      - '#89b4fa'  # blue
    selectedLineBgColor:
      - '#313244'  # surface0
    cherryPickedCommitBgColor:
      - '#45475a'  # surface1
    cherryPickedCommitFgColor:
      - '#cba6f7'  # mauve
    markedBaseCommitBgColor:
      - '#f9e2af'  # yellow
    markedBaseCommitFgColor:
      - '#1e1e2e'  # base
    unstagedChangesColor:
      - '#f38ba8'  # red
    defaultFgColor:
      - '#cdd6f4'  # text
    searchingActiveBorderColor:
      - '#f9e2af'  # yellow

  # Enhanced UI features
  commitLength:
    show: true
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: true
  showFileTree: true
  showListFooter: true
  showRandomTip: false
  showCommandLog: true
  commandLogSize: 8

  # Author colors using Catppuccin palette
  authorColors:
    '*': '#b4befe'  # lavender (default)

  # Custom file icons and colors with Catppuccin Mocha palette
  customIcons:
    filenames:
      ".gitignore": { icon: "", color: "#f38ba8" }
      "README.md": { icon: "", color: "#89b4fa" }
      "package.json": { icon: "", color: "#a6e3a1" }
    extensions:
      ".md": { icon: "", color: "#cdd6f4" }
      ".js": { icon: "", color: "#f9e2af" }
      ".ts": { icon: "", color: "#89b4fa" }
      ".py": { icon: "", color: "#f9e2af" }
      ".json": { icon: "", color: "#f9e2af" }
      ".yml": { icon: "", color: "#cba6f7" }
      ".yaml": { icon: "", color: "#cba6f7" }

  # Enable Nerd Fonts for file icons
  nerdFontsVersion: "3"
  showFileIcons: true

git:
  # Delta with Catppuccin Mocha theme - CORRECTED FORMAT
  paging:
    colorArg: always
    pager: 'delta --features catppuccin-mocha --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'

  merging:
    manualCommit: false
    args: ''

  log:
    order: 'topo-order'
    showGraph: 'when-maximised'

  skipHookPrefix: WIP
  autoFetch: true
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --'
  overrideGpg: false
  disableForcePushing: false
  parseEmoji: false

os:
  edit: 'nvim'
  editAtLine: 'nvim +{{line}} {{filename}}'

refresher:
  refreshInterval: 10
  fetchInterval: 60

update:
  method: prompt
  days: 14

confirmOnQuit: false
quitOnTopLevelReturn: false
disableStartupPopups: false
notARepository: 'prompt'

# Keep default keybindings (as requested)
keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
    quitWithoutChangingDirectory: 'Q'
    togglePanel: '<tab>'
    prevItem: '<up>'
    nextItem: '<down>'
    prevItem-alt: 'k'
    nextItem-alt: 'j'
    prevPage: ','
    nextPage: '.'
    gotoTop: '<'
    gotoBottom: '>'
    scrollLeft: 'H'
    scrollRight: 'L'
    prevBlock: '<left>'
    nextBlock: '<right>'
    prevBlock-alt: 'h'
    nextBlock-alt: 'l'
    jumpToBlock: ['1', '2', '3', '4', '5']
    nextMatch: 'n'
    prevMatch: 'N'
    optionMenu: 'x'
    optionMenu-alt1: '?'
    select: '<space>'
    goInto: '<enter>'
    openRecentRepos: '<c-r>'
    confirm: '<enter>'
    remove: 'd'
    new: 'n'
    edit: 'e'
    openFile: 'o'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    scrollUpMain-alt1: 'K'
    scrollDownMain-alt1: 'J'
    scrollUpMain-alt2: '<c-u>'
    scrollDownMain-alt2: '<c-d>'
    executeShellCommand: ':'
    createRebaseOptionsMenu: 'm'
    pushFiles: 'P'
    pullFiles: 'p'
    refresh: 'R'
    createPatchOptionsMenu: '<c-p>'
    nextTab: ']'
    prevTab: '['
    nextScreenMode: '+'
    prevScreenMode: '_'
    undo: 'z'
    redo: '<c-z>'
    filteringMenu: '<c-s>'
    diffingMenu: 'W'
    diffingMenu-alt: '<c-e>'
    copyToClipboard: '<c-o>'
    submitEditorText: '<enter>'
    extrasMenu: '@'
    toggleWhitespaceInDiffView: '<c-w>'

  status:
    checkForUpdate: 'u'
    recentRepos: '<enter>'

  files:
    commitChanges: 'c'
    commitChangesWithoutHook: 'w'
    commitChangesWithEditor: 'C'
    amendLastCommit: 'A'
    ignoreFile: 'i'
    refreshFiles: 'r'
    stashAllChanges: 's'
    viewStashOptions: 'S'
    toggleStagedAll: 'a'
    viewResetOptions: 'D'
    fetch: 'f'
    toggleTreeView: '`'

  branches:
    createPullRequest: 'o'
    viewPullRequestOptions: 'O'
    checkoutBranchByName: 'c'
    forceCheckoutBranch: 'F'
    rebaseBranch: 'r'
    mergeIntoCurrentBranch: 'M'
    viewGitFlowOptions: 'i'
    fastForward: 'f'
    pushTag: 'P'
    setUpstream: 'u'
    fetchRemote: 'f'

  commits:
    squashDown: 's'
    renameCommit: 'r'
    renameCommitWithEditor: 'R'
    viewResetOptions: 'g'
    markCommitAsFixup: 'f'
    createFixupCommit: 'F'
    squashAboveCommits: 'S'
    moveDownCommit: '<c-j>'
    moveUpCommit: '<c-k>'
    amendToCommit: 'A'
    pickCommit: 'p'
    revertCommit: 't'
    cherryPickCopy: 'c'
    pasteCommits: 'v'
    tagCommit: 'T'
    checkoutCommit: '<space>'
    resetCherryPick: '<c-R>'
    openLogMenu: '<c-l>'

  stash:
    popStash: 'g'

  commitFiles:
    checkoutCommitFile: 'c'

  main:
    toggleSelectHunk: 'a'
    pickBothHunks: 'b'

  submodules:
    init: 'i'
    update: 'u'
    bulkMenu: 'b'

# Keep existing custom commands
customCommands:
  - key: "z"
    command: "git cz"
    context: "files"
    loadingText: "Opening commitizen commit tool"
    output: terminal
